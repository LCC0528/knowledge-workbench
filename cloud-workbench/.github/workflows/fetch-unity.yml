name: Unity Weekly Report

on:
  schedule:
    - cron: '0 0 * * 1'  # UTC 0:00 Monday = 北京时间 8:00 周一
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests feedparser beautifulsoup4

      - name: Fetch Unity news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python fetch_news.py --topic unity

      - name: Generate summary
        run: |
          python generate_summary.py --topic unity

      - name: Push to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python push_to_wechat.py --topic unity

      - name: Save report
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p "data/unity"
          if [ -f "data/unity/latest.md" ]; then
            cp "data/unity/latest.md" "data/unity/$DATE.md"
          fi

      - name: Update index
        run: |
          python update_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain | head -1)" ]; then
            git commit -m "Update Unity report: $(date +%Y-%m-%d)"
            git push
          fi