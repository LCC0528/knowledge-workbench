<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鑻辫瀛︿範宸ヤ綔鍙?路 鑹惧娴╂柉鑳屽崟璇?/title>
    <style>
        :root {
            --bg: #f5f0eb;
            --card: #ffffff;
            --primary: #5b7a6e;
            --primary-light: #e8f0ec;
            --primary-dark: #3d5a4e;
            --accent: #d4a373;
            --accent-light: #faf0e6;
            --success: #7a9e7e;
            --danger: #c97b7b;
            --text: #3d3d3d;
            --text-light: #8a8a8a;
            --shadow: 0 4px 24px rgba(91, 122, 110, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            padding: 16px;
        }
        .container { max-width: 520px; margin: 0 auto; }
        .hidden { display: none !important; }

        header {
            text-align: center;
            padding: 24px 16px 16px;
            background: var(--card);
            border-radius: var(--radius);
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        header h1 { font-size: 22px; color: var(--primary-dark); font-weight: 600; }
        header .sub { color: var(--text-light); font-size: 13px; margin-top: 4px; display: flex; justify-content: center; gap: 16px; }
        header .sub span { cursor: pointer; padding: 2px 8px; border-radius: 8px; transition: background 0.2s; }
        header .sub span:hover { background: var(--primary-light); }
        header .sub span.active { background: var(--primary-light); color: var(--primary-dark); font-weight: 500; }

        .nav-tabs {
            display: flex;
            gap: 0;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin: 12px 0 0;
        }
        .nav-tabs button {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-tabs button.active {
            background: var(--card);
            color: var(--primary-dark);
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .progress-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .progress-track {
            flex: 1;
            height: 8px;
            background: var(--primary-light);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            border-radius: 4px;
            transition: width 0.4s ease;
        }
        .progress-text { font-size: 13px; color: var(--text-light); white-space: nowrap; }

        .review-card {
            text-align: center;
            padding: 32px 20px 24px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .review-card .word {
            font-size: 32px;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .review-card .word-small {
            font-size: 26px;
        }
        .review-card .hint {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .review-card .answer-section {
            width: 100%;
            padding: 20px;
            background: var(--accent-light);
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .review-card .answer-section .translation {
            font-size: 22px;
            color: var(--primary-dark);
            font-weight: 500;
            margin-bottom: 8px;
        }
        .review-card .answer-section .example {
            font-size: 15px;
            color: var(--text);
            line-height: 1.6;
            font-style: italic;
        }
        .review-card .answer-section .example-zh {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 6px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-accent { background: var(--accent); color: white; }
        .btn-accent:hover { background: #c4915e; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #5f8363; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #b56161; }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .btn-outline:hover { background: var(--primary-light); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-icon { padding: 10px 14px; font-size: 18px; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 4px;
            font-weight: 500;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #eee;
            border-radius: var(--radius-sm);
            font-size: 15px;
            transition: border-color 0.2s;
            font-family: inherit;
            background: #fafafa;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-item {
            text-align: center;
            padding: 14px 8px;
            background: var(--primary-light);
            border-radius: var(--radius-sm);
        }
        .stat-item .num { font-size: 24px; font-weight: 700; color: var(--primary-dark); }
        .stat-item .label { font-size: 12px; color: var(--text-light); margin-top: 2px; }

        .word-list { list-style: none; max-height: 360px; overflow-y: auto; }
        .word-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #f0f0f0;
        }
        .word-list li:last-child { border-bottom: none; }
        .word-list .w-en { font-weight: 500; color: var(--primary-dark); }
        .word-list .w-zh { color: var(--text-light); font-size: 13px; }
        .word-list .w-level {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary);
        }
        .word-list .w-del {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 4px 8px;
            font-size: 16px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .word-list .w-del:hover { opacity: 1; }

        .celebration {
            text-align: center;
            padding: 40px 20px;
        }
        .celebration .emoji { font-size: 64px; margin-bottom: 12px; }
        .celebration h2 { color: var(--primary-dark); font-size: 24px; margin-bottom: 8px; }
        .celebration p { color: var(--text-light); font-size: 14px; line-height: 1.6; }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .settings-row label { font-size: 14px; color: var(--text); }
        .settings-row input[type="number"] {
            width: 72px;
            padding: 6px 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        .settings-row input[type="number"]:focus { outline: none; border-color: var(--primary); }

        .streak-bar {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin: 12px 0;
        }
        .streak-bar .day {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-light);
        }
        .streak-bar .day.done { background: var(--success); color: white; }
        .streak-bar .day.today { border: 2px solid var(--primary); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-dark);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        .level-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 11px;
            color: white;
        }
        .sync-idle { color: var(--text-light); }
        .sync-syncing { color: var(--accent); animation: spin 1s linear infinite; display:inline-block; }
        .sync-ok { color: var(--success); }
        .sync-fail { color: var(--danger); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .level-0 { background: #e0e0e0; color: #666; }
        .level-1 { background: #c8e6c9; color: #2e7d32; }
        .level-2 { background: #a5d6a7; color: #1b5e20; }
        .level-3 { background: #81c784; color: #1b5e20; }
        .level-4 { background: #66bb6a; color: white; }
        .level-5 { background: #4caf50; color: white; }

        .chart-block { margin: 16px 0; }
        .chart-title { font-size:14px; color:var(--primary-dark); font-weight:600; margin-bottom:8px; }

        .bar-chart-h { display:flex; flex-direction:column; gap:6px; }
        .bar-row { display:grid; grid-template-columns:56px 1fr 28px; align-items:center; gap:8px; }
        .bar-label { font-size:11px; color:var(--text-light); text-align:right; }
        .bar-track { height:16px; background:#f0f0f0; border-radius:8px; overflow:hidden; }
        .bar-fill { height:100%; border-radius:8px; transition:width 0.5s ease; min-width:0; }
        .bar-count { font-size:11px; color:var(--primary-dark); font-weight:600; }

        .bar-chart-v { display:flex; align-items:flex-end; gap:4px; height:80px; padding:0 2px; }
        .bar-v { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
        .bar-v .col { width:100%; border-radius:4px 4px 0 0; min-height:2px; transition:height 0.5s ease; }
        .bar-v .day-label { font-size:9px; color:var(--text-light); }

        .sparkline { display:flex; align-items:flex-end; gap:2px; height:60px; padding:4px 0; }
        .sparkline .dot { flex:1; border-radius:2px 2px 0 0; min-height:2px; transition:height 0.5s ease; }

        @media (max-width: 400px) {
            body { padding: 10px; }
            .card { padding: 16px; }
            .review-card { padding: 20px 12px; }
            .review-card .word { font-size: 26px; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .btn { padding: 10px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <header>
        <h1>馃摑 鑻辫瀛︿範宸ヤ綔鍙?/h1>
        <div class="sub">
            <span class="active" data-tab="review" onclick="switchTab('review')">澶嶄範</span>
            <span data-tab="add" onclick="switchTab('add')">褰曞叆</span>
            <span data-tab="stats" onclick="switchTab('stats')">缁熻</span>
            <span data-tab="wrong" onclick="switchTab('wrong')">閿欒瘝</span>
            <span data-tab="settings" onclick="switchTab('settings')">璁剧疆</span>
        </div>
    </header>

    <div id="tab-review">
        <div id="review-ready" class="card">
            <div class="stats-grid" id="dailyStats">
                <div class="stat-item">
                    <div class="num" id="statDue">0</div>
                    <div class="label">浠婃棩寰呭涔?/div>
                </div>
                <div class="stat-item">
                    <div class="num" id="statNew">0</div>
                    <div class="label">鏂拌瘝寰呭綍鍏?/div>
                </div>
                <div class="stat-item">
                    <div class="num" id="statTotal">0</div>
                    <div class="label">鎬昏瘝姹囬噺</div>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill" style="width:0%"></div>
                </div>
                <div class="progress-text" id="progressText">0 / 0</div>
            </div>

            <div id="reviewContent">
                <div id="reviewCard" class="review-card hidden">
                    <div class="word" id="wordDisplay"></div>
                    <div style="font-size:14px;color:var(--text-light);margin-bottom:2px;" id="phoneticDisplay"></div>
                    <div style="font-size:13px;color:var(--accent);margin-bottom:6px;" id="posDisplay"></div>
                    <div class="hint">鐐瑰嚮銆愮湅绛旀銆戝悗閫夋嫨璁板緱涓庡惁</div>
                    <div id="answerSection" class="answer-section hidden">
                        <div class="translation" id="translationDisplay"></div>
                        <div class="example" id="exampleDisplay"></div>
                        <div class="example-zh" id="exampleZhDisplay"></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-accent" onclick="showAnswer()">馃憗 鐪嬬瓟妗?/button>
                        <button class="btn btn-danger" onclick="markForgot()" id="btnForgot">鉂?娌¤浣?/button>
                        <button class="btn btn-success" onclick="markRemembered()" id="btnRemember">鉁?璁颁笅浜?/button>
                    </div>
                </div>

                <div id="reviewEmpty" class="empty-state">
                    <div class="icon">馃帀</div>
                    <h2 style="color: var(--primary-dark); margin-bottom: 8px;">浠婃棩浠诲姟瀹屾垚锛?/h2>
                    <p>浠婂ぉ娌℃湁寰呭涔犵殑鍗曡瘝浜嗭紝浼戞伅涓€涓嬫垨褰曞叆鏂拌瘝鍚с€?/p>
                    <div style="margin-top: 16px;">
                        <button class="btn btn-primary" onclick="switchTab('add')">鉃?褰曞叆鏂拌瘝</button>
                    </div>
                </div>

                <div id="reviewWelcome" class="review-card">
                    <div class="empty-state">
                        <div class="icon">馃摎</div>
                        <h2 style="color: var(--primary-dark); margin-bottom: 8px;">鍑嗗灏辩华</h2>
                        <p id="welcomeText">姝ｅ湪璁＄畻浠婃棩澶嶄範鏁伴噺...</p>
                        <div style="margin-top: 20px;">
                            <button class="btn btn-primary" onclick="startReview()">馃殌 寮€濮嬪涔?/button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-add" class="hidden">
        <div class="card" id="singleEntry">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2 style="color: var(--primary-dark); font-size: 18px;">鉃?褰曞叆鏂板崟璇?/h2>
                <button class="btn btn-sm btn-outline" onclick="toggleBatchMode()">馃搵 鎵归噺褰曞叆</button>
            </div>
            <div class="form-group">
                <label>鑻辨枃鍗曡瘝 / 鐭 *</label>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="inputWord" placeholder="濡傦細ubiquitous" autocomplete="off" style="flex:1;">
                    <button class="btn btn-sm btn-outline" onclick="autoFillWord()" id="btnAutoFill" style="white-space:nowrap;">馃攧 鑷姩</button>
                </div>
                <div id="autoFillStatus" style="font-size:12px;color:var(--text-light);margin-top:4px;"></div>
            </div>
            <div class="form-group">
                <label>涓枃閲婁箟 *</label>
                <input type="text" id="inputTranslation" placeholder="濡傦細鏃犲涓嶅湪鐨? autocomplete="off">
            </div>
            <div class="form-group">
                <label>渚嬪彞锛堣嫳鏂囷級</label>
                <textarea id="inputExample" placeholder="濡傦細Smartphones are ubiquitous in modern society." rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>渚嬪彞缈昏瘧锛堜腑鏂囷級</label>
                <textarea id="inputExampleTranslation" placeholder="濡傦細鏅鸿兘鎵嬫満鍦ㄧ幇浠ｇぞ浼氭棤澶勪笉鍦ㄣ€? rows="2"></textarea>
            </div>
            <button class="btn btn-primary" onclick="addWord()" style="width:100%">馃捑 淇濆瓨</button>
        </div>

        <div class="card hidden" id="batchEntry">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h2 style="color: var(--primary-dark); font-size: 18px;">馃搵 鎵归噺褰曞叆</h2>
                <button class="btn btn-sm btn-outline" onclick="toggleBatchMode()">鉁忥笍 鍗曚釜褰曞叆</button>
            </div>
            <div class="form-group">
                <label>姣忚涓€涓崟璇嶏紝鏍煎紡锛?code>鑻辨枃 | 涓枃 | 渚嬪彞 | 渚嬪彞缈昏瘧</code></label>
                <textarea id="batchInput" placeholder="ubiquitous | 鏃犲涓嶅湪鐨?| Smartphones are ubiquitous. | 鏅鸿兘鎵嬫満鏃犲涓嶅湪銆?diligent | 鍕ゅ鐨?| She is a diligent student. | 濂规槸涓嫟濂嬬殑瀛︾敓銆?eloquent | 闆勮京鐨?| His speech was eloquent. | 浠栫殑婕旇寰堥泟杈┿€? rows="8" style="font-size:14px;font-family:Consolas,monospace;"></textarea>
            </div>
            <div style="font-size:12px;color:var(--text-light);margin-bottom:12px;line-height:1.6;">
                <strong>鏀寔鐨勫垎闅旂锛?/strong><code>|</code>锛堢珫绾匡級銆?code>TAB</code>锛堝埗琛ㄧ锛夈€?code>-</code>锛堢煭妯級
                <br>渚嬪彞鍜屼緥鍙ョ炕璇戝彲閫夊～
            </div>
            <div style="display:flex;gap:8px;margin-bottom:12px">
                <button class="btn btn-outline btn-sm" onclick="batchAutoFill()" style="flex:1">馃攧 鎵归噺鑷姩缈昏瘧</button>
                <button class="btn btn-primary btn-sm" onclick="batchAdd()" style="flex:1">馃摝 鎵归噺瀵煎叆</button>
            </div>
            <div id="batchStatus" style="font-size:12px;color:var(--text-light);margin-bottom:6px;"></div>
            <div id="batchResult" class="hidden" style="padding:12px;border-radius:10px;background:var(--primary-light);font-size:13px;line-height:1.6;"></div>
        </div>
    </div>

    <div id="tab-stats" class="hidden">
        <div class="card">
            <h2 style="color: var(--primary-dark); font-size: 18px; margin-bottom: 16px;">馃搳 瀛︿範缁熻</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="num" id="statsTotal">0</div>
                    <div class="label">鎬昏瘝姹?/div>
                </div>
                <div class="stat-item">
                    <div class="num" id="statsMastered">0</div>
                    <div class="label">宸叉帉鎻?/div>
                </div>
                <div class="stat-item">
                    <div class="num" id="statsLearning">0</div>
                    <div class="label">瀛︿範涓?/div>
                </div>
            </div>

            <div id="chartSection">
                <div class="chart-block">
                    <div class="chart-title">馃搱 鎺屾彙鍒嗗竷</div>
                    <div id="levelChart"></div>
                </div>

                <div class="chart-block">
                    <div class="chart-title">馃搳 鏈懆澶嶄範</div>
                    <div class="bar-chart-v" id="weeklyChart"></div>
                </div>

                <div class="chart-block">
                    <div class="chart-title">馃搱 绱澧為暱</div>
                    <div id="growthChart" class="sparkline"></div>
                </div>
            </div>

            <div style="margin: 16px 0;">

                <input type="number" id="dailyLimit" min="5" max="100" value="20">

            <hr style="border: none; border-top: 1px solid #f0f0f0; margin: 16px 0;">

            <div class="form-group">
                <label>Personal Access Token</label>
                <input type="password" id="githubTokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
            </div>

                <label>鍚屾鐘舵€?<span id="syncStatus" class="sync-idle">鈼?/span></label>
                <button class="btn btn-sm btn-outline" onclick="manualSync()">鉄?绔嬪嵆鍚屾</button>
            </div>

                <strong>濡備綍鑾峰彇 Token锛?/strong><br>
                1. 鎵撳紑 <a href="https://github.com/settings/tokens/new" target="_blank" style="color:var(--primary);">GitHub Token 鍒涘缓椤?/a><br>
                2. Note 濉换鎰忓悕绉帮紝鍕鹃€?<strong>repo</strong> 鏉冮檺<br>
                3. Generate 鍚庡鍒剁矘璐村埌涓婃柟杈撳叆妗?            </div>
            <hr style="border: none; border-top: 1px solid #f0f0f0; margin: 16px 0;">
            <div class="settings-row">
                <label style="color: var(--danger);">娓呯┖鎵€鏈夋暟鎹?/label>
                <button class="btn btn-sm btn-danger" onclick="clearAllData()">馃棏 娓呯┖</button>

<script>
    const STORAGE_KEY = 'english_workbench_words';
    const SETTINGS_KEY = 'english_workbench_settings';
    const CHECKIN_KEY = 'english_workbench_checkin';
    const GITHUB_TOKEN_KEY = 'ew_github_token';
    const REVIEW_LOG_KEY = 'english_workbench_review_log';

    const GITHUB_OWNER = 'LCC0528';
    const GITHUB_REPO = 'knowledge-workbench';
    const GITHUB_PATH = 'data/english-words.json';
    const GITHUB_RAW = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_PATH}`;
    const GITHUB_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;

    const INTERVALS = [0, 1, 3, 7, 15, 30];

    let state = {
        words: [],
        reviewQueue: [],
        reviewIndex: 0,
        currentAnswerShown: false,
        dailyLimit: 20,
        todayStr: '',
        syncStatus: 'idle',
        ghToken: '',
        ghFileSha: null
    };

    function getToday() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            state.words = raw ? JSON.parse(raw) : [];
        } catch { state.words = []; }

        try {
            const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY));
            if (settings) {
                state.dailyLimit = settings.dailyLimit || 20;
            }
        } catch {}

        state.todayStr = getToday();
        state.ghToken = getGhToken();
        document.getElementById('dailyLimit').value = state.dailyLimit;
        if (document.getElementById('githubToken')) {
            document.getElementById('githubToken').value = state.ghToken ? state.ghToken.substring(0, 10) + '路路路' : '';
        }
        document.getElementById('githubTokenInput').value = state.ghToken;

        if (state.ghToken) {
            pullFromGitHub();
        }

        migrateReviewLogs();
    }

    function saveWords() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.words));
        syncToGitHub();
    }

    function saveSettings() {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
            dailyLimit: state.dailyLimit
        }));
    }

    function getCheckinDates() {
        try {
            return JSON.parse(localStorage.getItem(CHECKIN_KEY)) || [];
        } catch { return []; }
    }

    function addCheckin(date) {
        const dates = getCheckinDates();
        if (!dates.includes(date)) {
            dates.push(date);
            localStorage.setItem(CHECKIN_KEY, JSON.stringify(dates));
        }
    }

    function addReviewLog(wordId, result) {
        const logs = JSON.parse(localStorage.getItem(REVIEW_LOG_KEY) || '[]');
        logs.push({ date: state.todayStr, wordId: wordId, result: result });
        localStorage.setItem(REVIEW_LOG_KEY, JSON.stringify(logs));
    }

    function getReviewLogs() {
        try { return JSON.parse(localStorage.getItem(REVIEW_LOG_KEY)) || []; }
        catch { return []; }
    }

    function migrateReviewLogs() {
        var logs = getReviewLogs();
        var changed = false;
        logs = logs.filter(function(l) {
            return typeof l.wordId === 'number';
        });
        logs = logs.map(function(l) {
            if (!l.result) {
                l.result = l.date === 'forgot' ? 'forgot' : 'remembered';
                changed = true;
            }
            return l;
        });
        if (changed) {
            localStorage.setItem(REVIEW_LOG_KEY, JSON.stringify(logs));
        }
    }

    function getDueWords() {
        return state.words.filter(w => w.nextReviewDate <= state.todayStr);
    }

    function getLevel(level) {
        return INTERVALS[level] !== undefined ? INTERVALS[level] : 30;
    }

    function getLevelLabel(level) {
        const labels = ['鏂拌瘝', '1澶?, '3澶?, '7澶?, '15澶?, '30澶?];
        return labels[level] || '30澶?;
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getGhToken() {
        try { return localStorage.getItem(GITHUB_TOKEN_KEY) || ''; } catch { return ''; }
    }

    function setGhToken(token) {
        state.ghToken = token;
        try { localStorage.setItem(GITHUB_TOKEN_KEY, token); } catch {}
    }

    function setSyncStatus(status) {
        state.syncStatus = status;
        const el = document.getElementById('syncStatus');
        if (el) {
            const icons = { idle: '鈼?, syncing: '鉄?, ok: '鉁?, fail: '鉁? };
            el.textContent = icons[status] || '鈼?;
            el.className = 'sync-' + status;
        }
    }

    async function fetchFromGitHub() {
        try {
            const resp = await fetch(GITHUB_RAW, { cache: 'no-cache' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return await resp.json();
        } catch { return null; }
    }

    async function syncToGitHub() {
        const token = getGhToken();
        if (!token) { setSyncStatus('idle'); return; }

        setSyncStatus('syncing');
        try {
            let sha = null;
            const getResp = await fetch(GITHUB_API, {
                headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (getResp.ok) {
                const existing = await getResp.json();
                sha = existing.sha;
            } else if (getResp.status !== 404) {
                throw new Error('GET failed: ' + getResp.status);
            }

            const content = btoa(unescape(encodeURIComponent(JSON.stringify(state.words, null, 2))));
            const body = { message: 'sync english words ' + state.todayStr, content: content };
            if (sha) body.sha = sha;

            const putResp = await fetch(GITHUB_API, {
                method: 'PUT',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!putResp.ok) throw new Error('PUT failed: ' + putResp.status + ' ' + (await putResp.text()));
            setSyncStatus('ok');
        } catch (e) {
            console.error('GitHub sync error:', e);
            setSyncStatus('fail');
            showToast('鍚屾澶辫触锛屾暟鎹凡淇濆瓨鍦ㄦ湰鍦?);
        }
    }

    async function pullFromGitHub() {
        const token = getGhToken();
        if (!token) return;

        setSyncStatus('syncing');
        try {
            const remote = await fetchFromGitHub();
            if (!remote) { setSyncStatus('idle'); return; }
            if (!Array.isArray(remote) || remote.length === 0) { setSyncStatus('idle'); return; }

            const localMap = new Map(state.words.map(w => [w.id, w]));
            let merged = false;
            remote.forEach(rw => {
                const local = localMap.get(rw.id);
                if (!local) {
                    state.words.push(rw);
                    merged = true;
                } else {
                    const rTime = new Date(rw.lastReviewDate || rw.createdDate || 0).getTime();
                    const lTime = new Date(local.lastReviewDate || local.createdDate || 0).getTime();
                    if (rTime > lTime) {
                        Object.assign(local, rw);
                        merged = true;
                    }
                }
            });

            if (merged) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state.words));
                showToast('宸插悓姝ュ叾浠栬澶囩殑鏁版嵁');
            }
            setSyncStatus('ok');
        } catch (e) {
            console.error('GitHub pull error:', e);
            setSyncStatus('idle');
        }
    }

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    function formatDate(dateStr) {
        const parts = dateStr.split('-');
        return parts[1] + '/' + parts[2];
    }

    function switchTab(tab) {
        document.querySelectorAll('[data-tab]').forEach(el => el.classList.remove('active'));
        document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');

        ['review','add','stats','wrong','settings'].forEach(t => {
            document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
        });

        if (tab === 'review') {
            if (window._wrongPractice) {
                window._wrongPractice = false;
            } else {
                prepareReview();
            }
        }
        if (tab === 'stats') renderStats();
        if (tab === 'wrong') renderWrongWords();
    }

    function autoFillWord() {
        const word = document.getElementById('inputWord').value.trim().toLowerCase();
        if (!word) { showToast('璇峰厛杈撳叆鑻辨枃鍗曡瘝'); return; }
        const status = document.getElementById('autoFillStatus');
        status.textContent = '鈴?鏌ヨ涓?..';
        document.getElementById('btnAutoFill').disabled = true;
        document.getElementById('inputTranslation').dataset.phonetic = '';

        const wordOnly = word.split(' ')[0];
        let cnOk = false;

        function fetchYoudaoJSONP(w) {
            return new Promise(resolve => {
                const cb = 'yd_cb_' + Date.now();
                let cleaned = false;
                function cleanup() {
                    if (cleaned) return;
                    cleaned = true;
                    delete window[cb];
                    const s = document.getElementById('yd_script');
                    if (s) s.remove();
                }
                window[cb] = function(data) {
                    cleanup();
                    if (data && data.data && data.data.entries && data.data.entries[0]) {
                        const e = data.data.entries[0];
                        resolve({
                            translation: e.explain ? e.explain.replace(/<[^>]+>/g, '').trim() : '',
                            phonetic: e.phonetic || ''
                        });
                    } else {
                        resolve(null);
                    }
                };
                const s = document.createElement('script');
                s.id = 'yd_script';
                s.src = 'https://dict.youdao.com/suggest?q=' + encodeURIComponent(w) + '&num=1&doctype=json&callback=' + cb;
                s.onerror = () => { cleanup(); resolve(null); };
                document.head.appendChild(s);
                setTimeout(() => { if (!cleaned) { cleanup(); resolve(null); } }, 5000);
            });
        }

        fetchYoudaoJSONP(wordOnly).then(result => {
            if (result && result.translation) {
                document.getElementById('inputTranslation').value = result.translation;
                cnOk = true;
                if (result.phonetic) {
                    document.getElementById('inputTranslation').dataset.phonetic = result.phonetic;
                }
                status.textContent = '鉁?涓枃閲婁箟宸插～鍏?;
            }
            fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(wordOnly))
                .then(r => r.ok ? r.json() : null).then(data => {
                    if (!data || !data[0]) throw new Error();
                    const meanings = data[0].meanings || [];
                    const posSet = new Set();
                    meanings.forEach(m => { if (m.partOfSpeech) posSet.add(m.partOfSpeech); });
                    const pos = [...posSet].join(', ');
                    const phon = data[0].phonetic || (data[0].phonetics && data[0].phonetics[0] && data[0].phonetics[0].text) || '';
                    if (phon && !document.getElementById('inputTranslation').dataset.phonetic) {
                        document.getElementById('inputTranslation').dataset.phonetic = phon;
                    }
                    const parts = [];
                    if (pos) parts.push('馃搸 ' + pos);
                    const finalPhon = document.getElementById('inputTranslation').dataset.phonetic || phon;
                    if (finalPhon) parts.push('馃攰 ' + finalPhon);
                    if (parts.length > 0 && !cnOk) status.textContent = parts.join(' 路 ') + ' 路 鈿狅笍 鏈壘鍒颁腑鏂囬噴涔?;
                    else if (parts.length > 0) status.textContent = parts.join(' 路 ');
                }).catch(() => {
                    if (!cnOk) status.textContent = '鈿狅笍 鏈壘鍒颁腑鏂囬噴涔夛紝璇锋墜鍔ㄥ～鍐?;
                }).finally(() => {
                    document.getElementById('btnAutoFill').disabled = false;
                });
        });
    }

    function addWord() {
        const word = document.getElementById('inputWord').value.trim();
        let translation = document.getElementById('inputTranslation').value.trim();
        const example = document.getElementById('inputExample').value.trim();
        const exampleTranslation = document.getElementById('inputExampleTranslation').value.trim();
        const phonetic = document.getElementById('inputTranslation').dataset.phonetic || '';
        const posHint = document.getElementById('autoFillStatus').textContent || '';

        if (!word || !translation) {
            showToast('璇疯嚦灏戝～鍐欒嫳鏂囧拰涓枃閲婁箟');
            return;
        }

        const exists = state.words.some(w => w.word.toLowerCase() === word.toLowerCase());
        if (exists) {
            showToast('杩欎釜鍗曡瘝宸插瓨鍦?);
            return;
        }

        const newWord = {
            id: Date.now(),
            word,
            translation,
            example,
            exampleTranslation,
            createdDate: state.todayStr,
            level: 0,
            nextReviewDate: state.todayStr,
            lastReviewDate: null,
            phonetic: phonetic,
            pos: posHint.replace(/^馃搸 璇嶆€э細/, '').replace(/ 路 .*$/, '').replace(/^鉁?*$/, '').replace(/^鈿狅笍.*$/, '').trim()
        };
        state.words.push(newWord);

        saveWords();

        document.getElementById('inputWord').value = '';
        document.getElementById('inputTranslation').value = '';
        document.getElementById('inputTranslation').dataset.phonetic = '';
        document.getElementById('inputExample').value = '';
        document.getElementById('inputExampleTranslation').value = '';
        document.getElementById('autoFillStatus').textContent = '';

        showToast('宸蹭繚瀛橈細' + word);
        updateDailyStats();
    }

    function prepareReview() {
        const due = getDueWords();
        const masteredToday = state.words.filter(w =>
            w.lastReviewDate === state.todayStr && w.level >= 5
        );

        const newDue = due.filter(w => w.lastReviewDate !== state.todayStr);
        const limit = state.dailyLimit;

        let pool = shuffle(newDue).slice(0, limit);

        state.reviewQueue = pool;
        state.reviewIndex = 0;
        state.currentAnswerShown = false;

        const welcome = document.getElementById('reviewWelcome');
        const card = document.getElementById('reviewCard');
        const empty = document.getElementById('reviewEmpty');

        if (pool.length === 0 && masteredToday.length > 0) {
            welcome.classList.add('hidden');
            card.classList.add('hidden');
            empty.classList.remove('hidden');
        } else if (pool.length === 0) {
            welcome.classList.remove('hidden');
            card.classList.add('hidden');
            empty.classList.add('hidden');
            document.getElementById('welcomeText').textContent = '浠婃棩娌℃湁寰呭涔犵殑鍗曡瘝锛屽綍鍏ユ柊璇嶅紑濮嬪涔犲惂锛?;
        } else {
            welcome.classList.add('hidden');
            empty.classList.add('hidden');
            card.classList.remove('hidden');
            showCurrentWord();
        }

        updateDailyStats();
        updateProgress();
    }

    function showCurrentWord() {
        if (state.reviewIndex >= state.reviewQueue.length) {
            prepareReview();
            return;
        }

        const w = state.reviewQueue[state.reviewIndex];
        document.getElementById('wordDisplay').textContent = w.word;
        document.getElementById('wordDisplay').className = 'word' + (w.word.length > 12 ? ' word-small' : '');
        document.getElementById('phoneticDisplay').textContent = w.phonetic || '';
        document.getElementById('posDisplay').textContent = w.pos || '';

        document.getElementById('answerSection').classList.add('hidden');
        document.getElementById('translationDisplay').textContent = '';
        document.getElementById('exampleDisplay').textContent = '';
        document.getElementById('exampleZhDisplay').textContent = '';

        state.currentAnswerShown = false;
        updateProgress();


    }

    function showAnswer() {
        if (state.currentAnswerShown) return;
        const w = state.reviewQueue[state.reviewIndex];
        if (!w) return;

        document.getElementById('translationDisplay').textContent = w.translation;
        document.getElementById('exampleDisplay').textContent = w.example || '';
        document.getElementById('exampleZhDisplay').textContent = w.exampleTranslation || '';
        document.getElementById('answerSection').classList.remove('hidden');

        state.currentAnswerShown = true;


    }

    function markRemembered() {
        if (!state.currentAnswerShown) {
            showToast('鍏堢湅绛旀鍐嶅垽鏂?);
            return;
        }
        const w = state.reviewQueue[state.reviewIndex];
        if (!w) return;

        const wordObj = state.words.find(x => x.id === w.id);
        if (!wordObj) return;

        wordObj.level = Math.min(wordObj.level + 1, 5);
        wordObj.lastReviewDate = state.todayStr;
        const interval = getLevel(wordObj.level);
        const next = new Date();
        next.setDate(next.getDate() + interval);
        wordObj.nextReviewDate = next.getFullYear() + '-' +
            String(next.getMonth()+1).padStart(2,'0') + '-' +
            String(next.getDate()).padStart(2,'0');

        addReviewLog(w.id, 'remembered');
        saveWords();
        state.reviewIndex++;
        showToast('璁颁笅浜嗭紒涓嬫澶嶄範锛? + getLevelLabel(wordObj.level));

        if (state.reviewIndex >= state.reviewQueue.length) {
            addCheckin(state.todayStr);
            prepareReview();
        } else {
            showCurrentWord();
        }
    }

    function markForgot() {
        if (!state.currentAnswerShown) {
            showToast('鍏堢湅绛旀鍐嶅垽鏂?);
            return;
        }
        const w = state.reviewQueue[state.reviewIndex];
        if (!w) return;

        const wordObj = state.words.find(x => x.id === w.id);
        if (!wordObj) return;

        wordObj.level = 0;
        wordObj.lastReviewDate = state.todayStr;
        const next = new Date();
        next.setDate(next.getDate() + 1);
        wordObj.nextReviewDate = next.getFullYear() + '-' +
            String(next.getMonth()+1).padStart(2,'0') + '-' +
            String(next.getDate()).padStart(2,'0');

        addReviewLog(w.id, 'forgot');
        saveWords();
        state.reviewIndex++;
        showToast('娌¤浣忥紝宸查噸缃负 1 澶╁悗澶嶄範');

        if (state.reviewIndex >= state.reviewQueue.length) {
            addCheckin(state.todayStr);
            prepareReview();
        } else {
            showCurrentWord();
        }
    }

    function fetchPhonetic(wordObj) {
        const word = wordObj.word.trim().toLowerCase().split(' ')[0];
        if (!word || wordObj.phonetic) return;
        const url = 'https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word);
        fetch(url).then(r => r.ok ? r.json() : null).then(data => {
            if (!data || !data[0]) throw new Error();
            const phon = data[0].phonetic || (data[0].phonetics && data[0].phonetics[0] && data[0].phonetics[0].text) || '';
            if (phon) {
                wordObj.phonetic = phon;
                saveWords();
                if (state.reviewQueue[state.reviewIndex] && state.reviewQueue[state.reviewIndex].id === wordObj.id) {
                    document.getElementById('phoneticDisplay').textContent = phon;
                }
            }
        }).catch(() => {
            try {
                fetch('https://dict.youdao.com/suggest?q=' + encodeURIComponent(word) + '&num=1&doctype=json')
                    .then(r => r.ok ? r.json() : null).then(d => {
                        if (d && d.data && d.data.entries && d.data.entries[0]) {
                            const phon = d.data.entries[0].phonetic || '';
                            if (phon) {
                                wordObj.phonetic = phon;
                                saveWords();
                                if (state.reviewQueue[state.reviewIndex] && state.reviewQueue[state.reviewIndex].id === wordObj.id) {
                                    document.getElementById('phoneticDisplay').textContent = phon;
                                }
                            }
                        }
                    }).catch(() => {});
            } catch(e) {}
        });
    }

    function startReview() {
        prepareReview();
    }

    function updateProgress() {
        const total = state.reviewQueue.length;
        const done = state.reviewIndex;
        const pct = total > 0 ? (done / total * 100) : 0;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = done + ' / ' + total;
    }

    function updateDailyStats() {
        const due = getDueWords().filter(w => w.lastReviewDate !== state.todayStr).length;
        document.getElementById('statDue').textContent = due;
        document.getElementById('statNew').textContent = state.words.filter(w => w.level === 0).length;
        document.getElementById('statTotal').textContent = state.words.length;
    }

    function renderStats() {
        const total = state.words.length;
        const mastered = state.words.filter(w => w.level >= 5).length;
        const learning = total - mastered;

        document.getElementById('statsTotal').textContent = total;
        document.getElementById('statsMastered').textContent = mastered;
        document.getElementById('statsLearning').textContent = learning;

        renderLevelChart();
        renderWeeklyChart();
        renderGrowthChart();

        const list = document.getElementById('wordList');
        list.innerHTML = '';
        const sorted = [...state.words].sort((a,b) => a.nextReviewDate.localeCompare(b.nextReviewDate));
        sorted.forEach(w => {
            const li = document.createElement('li');
            const levelClass = 'level-' + Math.min(w.level, 5);
            li.innerHTML = `
                <div>
                    <div class="w-en">${escHtml(w.word)}</div>
                    <div class="w-zh">${escHtml(w.translation)} 路 ${formatDate(w.nextReviewDate)}鍒版湡</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="w-level ${levelClass}">${getLevelLabel(w.level)}</span>
                    <button class="w-del" onclick="deleteWord(${w.id})">鉁?/button>
                </div>
            `;
            list.appendChild(li);
        });

        renderStreakBar();
    }

    function renderLevelChart() {
        const levels = [0,0,0,0,0,0];
        const labels = ['鏂拌瘝','1澶?,'3澶?,'7澶?,'15澶?,'宸叉帉鎻?];
        const colors = ['#e0e0e0','#c8e6c9','#a5d6a7','#81c784','#66bb6a','#4caf50'];
        state.words.forEach(w => { if (w.level >= 0 && w.level <= 5) levels[w.level]++; });
        const max = Math.max(...levels, 1);

        const container = document.getElementById('levelChart');
        container.innerHTML = '<div class="bar-chart-h">' +
            levels.map((count, i) =>
                `<div class="bar-row">
                    <span class="bar-label">${labels[i]}</span>
                    <div class="bar-track"><div class="bar-fill" style="width:${count/max*100}%;background:${colors[i]}"></div></div>
                    <span class="bar-count">${count}</span>
                </div>`
            ).join('') +
        '</div>';
    }

    function renderWeeklyChart() {
        const logs = getReviewLogs();
        const days = [];
        const dayLabels = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
            days.push(logs.filter(l => l.date === dateStr).length);
            dayLabels.push(['鏃?,'涓€','浜?,'涓?,'鍥?,'浜?,'鍏?][d.getDay()]);
        }
        const max = Math.max(...days, 1);

        const container = document.getElementById('weeklyChart');
        container.innerHTML = days.map((count, i) =>
            `<div class="bar-v">
                <div class="col" style="height:${count/max*100}%;background:var(--success)"></div>
                <span class="day-label">${dayLabels[i]}</span>
            </div>`
        ).join('');
    }

    function renderGrowthChart() {
        const sorted = [...state.words].sort((a,b) => a.createdDate.localeCompare(b.createdDate));
        if (sorted.length === 0) {
            document.getElementById('growthChart').innerHTML = '<div style="font-size:12px;color:var(--text-light);padding:10px">鏆傛棤鏁版嵁</div>';
            return;
        }
        const total = sorted.length;
        const segments = Math.min(total, 14);
        const step = Math.max(1, Math.floor(total / segments));
        const points = [];
        for (let i = 1; i <= segments; i++) {
            points.push(Math.min(i * step, total));
        }
        if (points[points.length-1] !== total) points.push(total);
        const max = total;

        const container = document.getElementById('growthChart');
        container.innerHTML = points.map(count =>
            `<div class="dot" style="height:${count/max*100}%;background:var(--primary)"></div>`
        ).join('');
    }

    function renderStreakBar() {
        const bar = document.getElementById('streakBar');
        bar.innerHTML = '';
        const dates = getCheckinDates();
        const today = state.todayStr;

        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateStr = d.getFullYear() + '-' +
                String(d.getMonth()+1).padStart(2,'0') + '-' +
                String(d.getDate()).padStart(2,'0');
            const day = document.createElement('div');
            day.className = 'day';
            if (dates.includes(dateStr)) day.classList.add('done');
            if (dateStr === today) day.classList.add('today');
            day.textContent = d.getDate();
            day.title = dateStr;
            bar.appendChild(day);
        }
    }

    function getWeakWords() {
        const logs = getReviewLogs();
        return state.words.map(function(w) {
            var total = logs.filter(function(l) { return l.wordId === w.id; }).length;
            var forgot = logs.filter(function(l) { return l.wordId === w.id && l.result === 'forgot'; }).length;
            var remembered = logs.filter(function(l) { return l.wordId === w.id && l.result === 'remembered'; }).length;
            return { word: w, total: total, forgot: forgot, remembered: remembered };
        });
    }

    function renderWrongWords(filter) {
        filter = filter || 'all';
        var weak = getWeakWords().filter(function(x) { return x.forgot > 0; });
        weak.sort(function(a,b) { return b.forgot - a.forgot || b.total - a.total; });

        var total = weak.length;
        var totalForgot = weak.reduce(function(s,x) { return s + x.forgot; }, 0);
        var totalRemembered = weak.reduce(function(s,x) { return s + x.remembered; }, 0);
        var accuracy = (totalForgot + totalRemembered) > 0
            ? Math.round(totalRemembered / (totalForgot + totalRemembered) * 100) : 0;
        var maxForgot = weak.length > 0 ? weak[0].forgot : 0;

        document.getElementById('wrongTotal').textContent = total;
        document.getElementById('wrongAccuracy').textContent = accuracy + '%';
        document.getElementById('wrongTop').textContent = maxForgot;

        var filtered = weak;
        if (filter === 'top') filtered = weak.filter(function(x) { return x.forgot >= Math.max(2, maxForgot * 0.5); });
        if (filter === 'recent') {
            var logs = getReviewLogs().filter(function(l) { return l.result === 'forgot'; });
            var recentIds = {};
            logs.slice(-20).forEach(function(l) { recentIds[l.wordId] = true; });
            filtered = weak.filter(function(x) { return recentIds[x.wordId]; });
        }

        var list = document.getElementById('wrongList');
        var empty = document.getElementById('wrongEmpty');
        list.innerHTML = '';

        if (filtered.length === 0) {
            empty.classList.remove('hidden');
            list.classList.add('hidden');
            return;
        }
        empty.classList.add('hidden');
        list.classList.remove('hidden');

        filtered.forEach(function(x) {
            var li = document.createElement('li');
            li.style.cursor = 'pointer';
            li.onclick = function() {
                document.getElementById('inputWord').value = x.word.word;
                switchTab('add');
                autoFillWord();
            };
            var pct = x.total > 0 ? Math.round((1 - x.forgot / x.total) * 100) : 0;
            li.innerHTML =
                '<div><div class="w-en">' + escHtml(x.word.word) + '</div>' +
                '<div class="w-zh">' + escHtml(x.word.translation) + ' 路 璁伴敊' + x.forgot + '娆?/div></div>' +
                '<span class="w-level" style="background:' + (pct < 50 ? 'var(--danger)' : pct < 80 ? 'var(--accent)' : 'var(--success)') + ';color:#fff">' + pct + '%</span>';
            list.appendChild(li);
        });
    }

    function practiceWrongWords() {
        var weak = getWeakWords().filter(function(x) { return x.forgot > 0; });
        if (weak.length === 0) { showToast('鉁?娌℃湁閿欒瘝闇€瑕佸涔?); return; }
        weak.sort(function(a,b) { return b.forgot - a.forgot; });
        state.reviewQueue = shuffle(weak.map(function(x) { return x.word; }));
        state.reviewIndex = 0;
        state.currentAnswerShown = false;
        window._wrongPractice = true;
        switchTab('review');
        var welcome = document.getElementById('reviewWelcome');
        var card = document.getElementById('reviewCard');
        var empty = document.getElementById('reviewEmpty');
        welcome.classList.add('hidden');
        empty.classList.add('hidden');
        card.classList.remove('hidden');
        showCurrentWord();
        updateProgress();
        showToast('馃摉 閿欒瘝澶嶄範锛氬叡 ' + state.reviewQueue.length + ' 涓?);
    }

    function clearWrongLog() {
        if (!confirm('纭畾娓呯┖鎵€鏈夐敊璇嶈褰曪紵')) return;
        localStorage.removeItem(REVIEW_LOG_KEY);
        renderWrongWords();
        showToast('閿欒瘝璁板綍宸叉竻绌?);
    }

    function deleteWord(id) {
        if (!confirm('纭畾鍒犻櫎杩欎釜鍗曡瘝锛?)) return;
        state.words = state.words.filter(w => w.id !== id);
        saveWords();
        renderStats();
        updateDailyStats();
        showToast('宸插垹闄?);
    }

    function clearAllData() {
        if (!confirm('鈿狅笍 纭畾娓呯┖鎵€鏈夊崟璇嶆暟鎹拰鎵撳崱璁板綍锛熸鎿嶄綔涓嶅彲鎭㈠锛?)) return;
        if (!confirm('鍐嶆纭锛氱湡鐨勮娓呯┖鍚楋紵')) return;
        state.words = [];
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(CHECKIN_KEY);
        saveWords();
        renderStats();
        updateDailyStats();
        prepareReview();
        showToast('鏁版嵁宸叉竻绌?);
    }

    function toggleBatchMode() {
        document.getElementById('singleEntry').classList.toggle('hidden');
        document.getElementById('batchEntry').classList.toggle('hidden');
    }

    window._batchEntries = null;

    function batchAutoFill() {
        var text = document.getElementById('batchInput').value.trim();
        if (!text) { showToast('璇峰厛杈撳叆鍗曡瘝'); return; }
        var lines = text.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });
        var status = document.getElementById('batchStatus');
        var result = document.getElementById('batchResult');
        result.classList.remove('hidden');
        status.textContent = '鈴?姝ｅ湪缈昏瘧 0/' + lines.length + ' ...';
        result.innerHTML = '';

        var entries = [];
        lines.forEach(function(line) {
            var parts;
            if (line.includes('|')) parts = line.split('|').map(function(s) { return s.trim(); });
            else if (line.includes('\t')) parts = line.split('\t').map(function(s) { return s.trim(); });
            else if (line.match(/^[^-]+-[^-]+/)) { parts = line.split(/-(.+)/).map(function(s) { return s.trim(); }); if (parts.length > 2) parts = [parts[0], parts[1]]; }
            else parts = [line];
            entries.push({ word: parts[0], translation: parts[1] || '', example: parts[2] || '', exampleTranslation: parts[3] || '' });
        });

        var completed = 0;
        var html = '';
        window._batchEntries = entries;

        function next(i) {
            if (i >= entries.length) {
                status.textContent = '鉁?缈昏瘧瀹屾垚銆傛鏌ユ棤璇悗鐐瑰嚮"鎵归噺瀵煎叆"';
                result.innerHTML = '<div style="border-bottom:1px solid rgba(0,0,0,0.06);padding-bottom:8px;margin-bottom:8px;font-weight:600;color:var(--primary-dark)">棰勮锛? + entries.length + ' 涓崟璇嶏級</div>' + html;
                return;
            }
            var e = entries[i];
            if (e.translation) {
                html += '<div style="display:flex;gap:4px;margin-bottom:4px"><span style="font-weight:500;min-width:80px">' + escHtml(e.word) + '</span><span>' + escHtml(e.translation) + '</span></div>';
                completed++;
                status.textContent = '鈴?姝ｅ湪缈昏瘧 ' + completed + '/' + entries.length + ' ...';
                result.innerHTML = '<div style="border-bottom:1px solid rgba(0,0,0,0.06);padding-bottom:8px;margin-bottom:8px;font-weight:600;color:var(--primary-dark)">缈昏瘧涓?..</div>' + html;
                next(i + 1);
                return;
            }
            fetchYoudaoJSONP(e.word).then(function(data) {
                if (data && data.translation) {
                    e.translation = data.translation;
                    if (data.phonetic) e.phonetic = data.phonetic;
                }
                html += '<div style="display:flex;gap:4px;margin-bottom:4px"><span style="font-weight:500;min-width:80px">' + escHtml(e.word) + '</span><span>' + escHtml(e.translation || '鈿狅笍 鏈壘鍒?) + '</span></div>';
                completed++;
                status.textContent = '鈴?姝ｅ湪缈昏瘧 ' + completed + '/' + entries.length + ' ...';
                result.innerHTML = '<div style="border-bottom:1px solid rgba(0,0,0,0.06);padding-bottom:8px;margin-bottom:8px;font-weight:600;color:var(--primary-dark)">缈昏瘧涓?..</div>' + html;
                next(i + 1);
            });
        }
        next(0);
    }

    function batchAdd() {
        if (window._batchEntries && window._batchEntries.length > 0) {
            var entries = window._batchEntries;
            window._batchEntries = null;
            var addedAuto = 0, skippedAuto = 0;
            entries.forEach(function(e) {
                if (!e.word || !e.translation) return;
                var exists = state.words.some(function(w) { return w.word.toLowerCase() === e.word.toLowerCase(); });
                if (exists) { skippedAuto++; return; }
                var w = {
                    id: Date.now() + addedAuto,
                    word: e.word,
                    translation: e.translation,
                    example: e.example || '',
                    exampleTranslation: e.exampleTranslation || '',
                    createdDate: state.todayStr,
                    level: 0,
                    nextReviewDate: state.todayStr,
                    lastReviewDate: null,
                    phonetic: e.phonetic || ''
                };
                state.words.push(w);
                fetchPhonetic(w);
                addedAuto++;
            });
            if (addedAuto > 0) { saveWords(); updateDailyStats(); }
            showToast('鉁?瀵煎叆 ' + addedAuto + ' 涓崟璇? + (skippedAuto ? '锛岃烦杩?' + skippedAuto + ' 涓噸澶? : ''));
            document.getElementById('batchInput').value = '';
            document.getElementById('batchResult').classList.add('hidden');
            return;
        }

        const text = document.getElementById('batchInput').value.trim();

        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        let added = 0, skipped = 0, errors = [];

        lines.forEach((line, idx) => {
            let parts;
            if (line.includes('|')) {
                parts = line.split('|').map(s => s.trim());
            } else if (line.includes('\t')) {
                parts = line.split('\t').map(s => s.trim());
            } else if (line.match(/^[^-]+-[^-]+/)) {
                parts = line.split(/-(.+)/).map(s => s.trim());
                if (parts.length > 2) parts = [parts[0], parts[1]];
            } else {
                errors.push('绗?' + (idx+1) + ' 琛岋細鏃犳硶璇嗗埆鍒嗛殧绗?);
                return;
            }

            const word = parts[0];
            const translation = parts[1] || '';
            const example = parts[2] || '';
            const exampleTranslation = parts[3] || '';

            if (!word || !translation) {
                errors.push('绗?' + (idx+1) + ' 琛岋細缂哄皯鑻辨枃鎴栦腑鏂?);
                return;
            }

            const exists = state.words.some(w => w.word.toLowerCase() === word.toLowerCase());
            if (exists) { skipped++; return; }

            const w = {
                id: Date.now() + added,
                word, translation, example, exampleTranslation,
                createdDate: state.todayStr,
                level: 0,
                nextReviewDate: state.todayStr,
                lastReviewDate: null,
                phonetic: ''
            };
            state.words.push(w);
            fetchPhonetic(w);
            added++;
        });

        if (added > 0) {
            saveWords();
            updateDailyStats();
        }

        const result = document.getElementById('batchResult');
        result.classList.remove('hidden');
        result.style.background = added > 0 ? 'var(--primary-light)' : '#fff3e0';
        result.innerHTML = '';
        const msgs = [];
        if (added > 0) msgs.push('鉁?鎴愬姛瀵煎叆 <strong>' + added + '</strong> 涓崟璇?);
        if (skipped > 0) msgs.push('鈴?璺宠繃閲嶅 <strong>' + skipped + '</strong> 涓?);
        if (errors.length > 0) msgs.push('鈿狅笍 ' + errors.slice(0, 3).join('<br>') + (errors.length > 3 ? '<br>...杩樻湁 ' + (errors.length-3) + ' 鏉￠敊璇? : ''));
        result.innerHTML = msgs.join('<br>');

        if (added > 0) {
            document.getElementById('batchInput').value = '';
            showToast('鎴愬姛瀵煎叆 ' + added + ' 涓崟璇?);
        }
    }

    function manualSync() {
        const input = document.getElementById('githubTokenInput');
        const token = input.value.trim();
        if (token) {
            setGhToken(token);
            document.getElementById('githubToken').value = token.substring(0, 10) + '路路路';
            showToast('Token 宸蹭繚瀛?);
        }
        pullFromGitHub().then(() => {
            updateDailyStats();
            if (state.words.length > 0) saveWords();
        });
    }

    function escHtml(s) {
        const div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        if (urlToken && urlToken.startsWith('ghp_')) {
            setGhToken(urlToken);
            window.history.replaceState({}, document.title, window.location.pathname);
            setTimeout(() => showToast('鉁?Token 宸茶嚜鍔ㄩ厤缃?), 500);
        }

        loadData();

        document.getElementById('dailyLimit').addEventListener('input', function() {
            state.dailyLimit = parseInt(this.value) || 20;
            saveSettings();
        });

        document.getElementById('inputWord').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('inputTranslation').focus();
        });
        document.getElementById('inputTranslation').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('inputExample').focus();
        });

        document.getElementById('githubTokenInput').addEventListener('change', function() {
            const token = this.value.trim();
            if (token) {
                setGhToken(token);
                showToast('Token 宸蹭繚瀛?);
            }
        });

        updateDailyStats();
        prepareReview();

        if (state.reviewQueue.length > 0) {
            document.getElementById('reviewWelcome').classList.remove('hidden');
        }
    });
</script>
