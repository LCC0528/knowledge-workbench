<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>学习笔记本</title>
<style>
:root{--bg:#f4f1ed;--card:#fff;--primary:#5b7a6e;--primary-light:#e8f0ec;--primary-dark:#3d5a4e;--accent:#d4a373;--text:#3d3d3d;--text-light:#8a8a8a;--border:#e8e4e0;--shadow:0 2px 16px rgba(91,122,110,0.08);--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{text-align:center;padding:20px 16px 12px;background:var(--card);position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}
.header h1{font-size:20px;color:var(--primary-dark)}
.header .back{display:inline-block;margin-bottom:6px;color:var(--primary);text-decoration:none;font-size:13px}
.container{max-width:600px;margin:0 auto;padding:12px 16px 80px}
.btn{display:inline-block;padding:8px 18px;border:none;border-radius:10px;font-size:14px;cursor:pointer;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-accent{background:var(--accent);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}
.btn-sm{padding:6px 14px;font-size:12px}
.hidden{display:none!important}
.note-list{display:flex;flex-direction:column;gap:8px}
.note-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;border:2px solid transparent}
.note-card:active{transform:scale(0.98)}
.note-card .title{font-size:15px;font-weight:600;color:var(--primary-dark);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-card .preview{font-size:12px;color:var(--text-light);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.note-card .meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text-light)}
.note-card .meta .tag{padding:1px 8px;border-radius:6px;background:var(--primary-light);color:var(--primary-dark)}
.note-card .has-img{font-size:11px;color:var(--accent)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.6}
.editor{display:flex;flex-direction:column;gap:12px}
.editor input[type="text"]{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:16px;outline:none;transition:.2s;background:var(--card)}
.editor input[type="text"]:focus{border-color:var(--primary)}
.editor .toolbar{display:flex;gap:6px;flex-wrap:wrap}
.editor .toolbar button{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;color:var(--text)}
.editor .toolbar button:active{background:var(--primary-light)}
.editor .content-area{min-height:200px;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;line-height:1.7;outline:none;background:var(--card);word-wrap:break-word;overflow-wrap:break-word}
.editor .content-area:focus{border-color:var(--primary)}
.editor .content-area img{max-width:100%;border-radius:8px;margin:8px 0;display:block}
.editor .editor-actions{display:flex;gap:8px;justify-content:flex-end}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;outline:none;background:var(--card)}
.search-bar input:focus{border-color:var(--primary)}
.search-bar select{padding:10px;border:2px solid var(--border);border-radius:12px;font-size:13px;outline:none;background:var(--card);color:var(--text)}
.fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(91,122,110,0.3);z-index:20;transition:.2s}
.fab:active{transform:scale(0.9)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px 16px 30px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal .modal-header h2{font-size:17px;color:var(--primary-dark)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 20px;border-radius:10px;font-size:13px;z-index:50;transition:opacity .3s;opacity:0;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="header">
  <a class="back" href="../web/index.html">← 返回工作台</a>
  <h1>📓 学习笔记本</h1>
</div>
<div class="container" id="app">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索笔记..." oninput="renderList()">
    <select id="filterCategory" onchange="renderList()">
      <option value="">全部分类</option>
      <option value="ai">AI</option>
      <option value="unity">Unity</option>
      <option value="english">英语</option>
      <option value="general">通用</option>
    </select>
  </div>
  <div id="emptyState" class="empty-state">
    <div class="icon">📝</div>
    <p>还没有笔记<br>点右下角 + 创建第一条</p>
  </div>
  <div id="noteList" class="note-list"></div>
</div>
<button class="fab" onclick="openEditor()">+</button>

<div id="editorOverlay" class="modal-overlay hidden" onclick="closeEditorOnOverlay(event)">
  <div class="modal" id="editorModal">
    <div class="modal-header">
      <h2 id="editorTitle">新建笔记</h2>
      <button onclick="closeEditor()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light)">✕</button>
    </div>
    <div class="editor">
      <input type="text" id="noteTitle" placeholder="笔记标题">
      <div class="toolbar">
        <button onclick="execCmd('bold')"><b>B</b></button>
        <button onclick="execCmd('italic')"><i>I</i></button>
        <button onclick="execCmd('underline')"><u>U</u></button>
        <button onclick="execCmd('insertUnorderedList')">列表</button>
        <button onclick="insertImage()">🖼 图片</button>
        <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageFile(event)">
      </div>
      <div class="content-area" id="noteContent" contenteditable="true"></div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <label style="font-size:13px;color:var(--text-light)">分类：</label>
        <select id="noteCategory" style="padding:6px 10px;border:2px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);color:var(--text)">
          <option value="general">通用</option>
          <option value="ai">AI</option>
          <option value="unity">Unity</option>
          <option value="english">英语</option>
        </select>
      </div>
      <div class="editor-actions">
        <button class="btn btn-outline btn-sm" onclick="closeEditor()">取消</button>
        <button class="btn btn-primary btn-sm" onclick="saveNote()">💾 保存</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'kb_notes';
let state = { notes: [], editingId: null };

function loadNotes() {
    try { state.notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { state.notes = []; }
}
function saveNotes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes));
}
function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function renderList() {
    var q = (document.getElementById('searchInput').value || '').toLowerCase();
    var cat = document.getElementById('filterCategory').value;
    var filtered = state.notes.filter(function(n) {
        if (cat && n.category !== cat) return false;
        if (q && !n.title.toLowerCase().includes(q) && !(n.textContent || '').toLowerCase().includes(q)) return false;
        return true;
    });
    filtered.sort(function(a,b) { return b.updatedAt - a.updatedAt; });

    var list = document.getElementById('noteList');
    var empty = document.getElementById('emptyState');
    list.innerHTML = '';
    if (filtered.length === 0 && state.notes.length === 0) {
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');

    var catMap = { ai:'AI', unity:'Unity', english:'英语', general:'通用' };
    filtered.forEach(function(n) {
        var div = document.createElement('div');
        div.className = 'note-card';
        div.onclick = function() { openEditor(n.id); };
        var hasImg = n.content && n.content.indexOf('<img') !== -1;
        var d = new Date(n.updatedAt);
        var dateStr = (d.getMonth()+1) + '/' + d.getDate();
        div.innerHTML =
            '<div class="title">' + escHtml(n.title || '无标题') + '</div>' +
            '<div class="preview">' + escHtml((n.textContent || '').substring(0,60)) + '</div>' +
            '<div class="meta">' +
                '<span class="tag">' + (catMap[n.category] || '通用') + '</span>' +
                '<span>' + dateStr + '</span>' +
                (hasImg ? '<span class="has-img">🖼</span>' : '') +
            '</div>';
        list.appendChild(div);
    });
}

function openEditor(id) {
    state.editingId = id || null;
    var overlay = document.getElementById('editorOverlay');
    var titleEl = document.getElementById('editorTitle');
    var noteTitle = document.getElementById('noteTitle');
    var noteContent = document.getElementById('noteContent');
    var noteCategory = document.getElementById('noteCategory');
    if (id) {
        var note = state.notes.find(function(n) { return n.id === id; });
        if (!note) return;
        titleEl.textContent = '编辑笔记';
        noteTitle.value = note.title || '';
        noteContent.innerHTML = note.content || '';
        noteCategory.value = note.category || 'general';
    } else {
        titleEl.textContent = '新建笔记';
        noteTitle.value = '';
        noteContent.innerHTML = '';
        noteCategory.value = 'general';
    }
    overlay.classList.remove('hidden');
    noteTitle.focus();
}

function closeEditor() {
    document.getElementById('editorOverlay').classList.add('hidden');
    state.editingId = null;
}
function closeEditorOnOverlay(e) {
    if (e.target === document.getElementById('editorOverlay')) closeEditor();
}
function execCmd(cmd, val) {
    document.getElementById('noteContent').focus();
    document.execCommand(cmd, false, val || null);
}
function insertImage() {
    document.getElementById('imageInput').click();
}
function handleImageFile(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
        var content = document.getElementById('noteContent');
        content.focus();
        document.execCommand('insertImage', false, ev.target.result);
        document.execCommand('insertHTML', false, '<br><br>');
        showToast('🖼 图片已插入');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
}

document.addEventListener('paste', function(e) {
    var overlay = document.getElementById('editorOverlay');
    if (overlay.classList.contains('hidden')) return;
    var items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (var i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') === 0) {
            e.preventDefault();
            var file = items[i].getAsFile();
            var reader = new FileReader();
            reader.onload = function(ev) {
                document.execCommand('insertImage', false, ev.target.result);
                document.execCommand('insertHTML', false, '<br><br>');
            };
            reader.readAsDataURL(file);
            return;
        }
    }
});

function saveNote() {
    var title = document.getElementById('noteTitle').value.trim() || '无标题';
    var contentEl = document.getElementById('noteContent');
    var content = contentEl.innerHTML;
    var textContent = contentEl.textContent;
    var category = document.getElementById('noteCategory').value;
    if (!content.replace(/<br>|<div>|<\/div>|\s/g,'').replace(/<img[^>]*>/g,'').trim() && content.indexOf('<img') === -1) {
        showToast('请写点内容');
        return;
    }
    if (state.editingId) {
        var note = state.notes.find(function(n) { return n.id === state.editingId; });
        if (note) {
            note.title = title;
            note.content = content;
            note.textContent = textContent;
            note.category = category;
            note.updatedAt = Date.now();
        }
    } else {
        state.notes.push({
            id: Date.now(),
            title: title,
            content: content,
            textContent: textContent,
            category: category,
            createdAt: Date.now(),
            updatedAt: Date.now()
        });
    }
    saveNotes();
    closeEditor();
    renderList();
    showToast(state.editingId ? '✅ 笔记已更新' : '✅ 笔记已创建');
}

function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

loadNotes();
renderList();
document.addEventListener('touchmove', function() {
    document.activeElement && document.activeElement.blur();
}, { passive: true });
</script>
</body>
</html>
