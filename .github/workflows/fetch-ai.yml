name: AI Daily Report
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-workbench
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests feedparser beautifulsoup4
      - name: Fetch AI news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python fetch_news.py
      - name: Generate summary
        run: python generate_summary.py
      - name: Generate news feed
        run: python generate_feed.py
      - name: Push to WeChat
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python push_to_wechat.py
      - name: Save report
        run: |
          DATE=$(date +'%Y-%m-%d')
          mkdir -p "data/ai"
          if [ -f "data/ai/latest.md" ]; then cp "data/ai/latest.md" "data/ai/$DATE.md"; fi
      - name: Update index
        run: python update_index.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain | head -1)" ]; then
            git commit -m "Update AI report: $(date +%Y-%m-%d)"
            git push
          fi
