<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 大事件 · 资讯雷达</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --primary: #3b5e8a;
            --primary-light: #e8eef6;
            --accent: #e67e22;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --tag-bg: #eef2f7;
            --shadow: 0 2px 20px rgba(59, 94, 138, 0.08);
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            padding: 16px;
        }
        .container { max-width: 720px; margin: 0 auto; }
        .hidden { display: none !important; }

        header {
            background: var(--card);
            border-radius: var(--radius);
            padding: 24px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 20px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        header .badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }
        header .sub { color: var(--text-light); font-size: 13px; }

        .loading, .error {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .loading .spinner {
            width: 32px; height: 32px;
            border: 3px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .date-group { margin-bottom: 20px; }
        .date-header {
            font-size: 15px;
            font-weight: 600;
            color: var(--primary);
            padding: 8px 4px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .date-header .count {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 400;
        }

        .news-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            transition: transform 0.15s;
        }
        .news-card:hover { transform: translateY(-1px); }

        .news-card .score {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .news-card .score .bar {
            width: 48px; height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
        }
        .news-card .score .bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
        }

        .news-card h2 {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .news-card h2 a {
            color: inherit;
            text-decoration: none;
        }
        .news-card h2 a:hover { color: var(--primary); }

        .news-card .summary {
            font-size: 14px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 10px;
        }

        .news-card .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-light);
        }
        .news-card .meta .source {
            background: var(--tag-bg);
            padding: 2px 10px;
            border-radius: 8px;
        }
        .news-card .meta .tag {
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 8px;
        }
        .news-card .meta .discuss a {
            color: var(--primary);
            text-decoration: none;
        }
        .news-card .meta .discuss a:hover { text-decoration: underline; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
            font-size: 12px;
        }
        footer a { color: var(--primary); text-decoration: none; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .back-link:hover { color: var(--primary); }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .news-card { padding: 16px; }
            .news-card h2 { font-size: 15px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <div class="back-link" onclick="history.back()">← 返回</div>
            <h1>📡 AI 大事件</h1>
            <div class="sub">Horizon 雷达自动抓取 · 每日更新</div>
        </div>
        <div class="badge" id="countBadge">加载中...</div>
    </header>

    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>正在获取最新 AI 资讯...</p>
    </div>

    <div id="error" class="error hidden">
        <div style="font-size:40px;margin-bottom:8px;">⚠️</div>
        <p>获取资讯失败，请稍后重试</p>
        <button class="btn" onclick="loadNews()" style="margin-top:12px;padding:8px 20px;border:none;border-radius:8px;background:var(--primary);color:white;cursor:pointer;">🔄 重试</button>
    </div>

    <div id="newsContent" class="hidden"></div>

    <footer>
        数据来源：<a href="https://github.com/Thysrael/Horizon">Horizon</a> · <a href="../web/index.html">返回知识库</a>
    </footer>
</div>

<script>
    const REPO = 'LCC0528/knowledge-workbench';
    const RAW_DIR = '01-AI高效使用/raw';

    async function loadNews() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('error').classList.add('hidden');
        document.getElementById('newsContent').classList.add('hidden');

        try {
            const files = await listRawFiles();
            const zhFiles = files.filter(f => f.name.endsWith('-zh.md') && f.name.startsWith('2026'));
            zhFiles.sort((a,b) => b.name.localeCompare(a.name));

            if (zhFiles.length === 0) throw new Error('No Chinese news files found');

            let allItems = [];
            for (const file of zhFiles) {
                const items = await parseNewsFile(file);
                allItems = allItems.concat(items);
            }

            allItems.sort((a,b) => b.date - a.date);
            renderNews(allItems);
        } catch (e) {
            console.error(e);
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }
    }

    async function listRawFiles() {
        const encoded = encodeURIComponent(RAW_DIR);
        const url = `https://api.github.com/repos/${REPO}/contents/${encoded}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Failed to list files: ' + resp.status);
        return await resp.json();
    }

    async function parseNewsFile(file) {
        const resp = await fetch(file.download_url);
        if (!resp.ok) throw new Error('Failed to fetch ' + file.name);
        const text = await resp.text();

        const dateMatch = file.name.match(/2026-\d{2}-\d{2}/);
        const fileDate = dateMatch ? dateMatch[0] : '';

        const items = [];
        const blocks = text.split(/---\n/);

        for (const block of blocks) {
            if (!block.includes('⭐️')) continue;

            const lines = block.split('\n').filter(l => l.trim());

            const titleLine = lines.find(l => l.startsWith('## ['));
            if (!titleLine) continue;

            const titleMatch = titleLine.match(/## \[(.+?)\]\((.+?)\)/);
            if (!titleMatch) continue;
            const title = titleMatch[1];
            const link = titleMatch[2];

            const scoreMatch = titleLine.match(/⭐️\s*([\d.]+)\/10/);
            const score = scoreMatch ? parseFloat(scoreMatch[1]) : 0;

            const summaryStart = lines.findIndex(l => l.startsWith(titleLine));
            let summary = '';
            for (let i = summaryStart + 1; i < lines.length; i++) {
                if (lines[i].startsWith('hackernews') || lines[i].startsWith('rss') || lines[i].startsWith('**标签**')) break;
                if (lines[i].startsWith('## [') || lines[i].startsWith('#')) break;
                summary += lines[i];
            }
            summary = summary.replace(/\s+/g, ' ').trim();

            const tagLine = lines.find(l => l.startsWith('**标签**'));
            const tags = tagLine ? tagLine.replace('**标签**:', '').replace(/`/g, '').split(',').map(s => s.trim()).filter(Boolean) : [];

            const discussLine = lines.find(l => l.includes('[社区讨论]'));
            const discussUrl = discussLine ? (discussLine.match(/\((.+?)\)/) || [])[1] || '' : '';

            const sourceLine = lines.find(l => l.startsWith('hackernews') || l.startsWith('rss'));
            let source = '';
            if (sourceLine) {
                const parts = sourceLine.split('·').map(s => s.trim());
                source = parts[0] || '';
            }

            items.push({
                title, link, score, summary, tags, source, discussUrl,
                date: new Date(fileDate).getTime(),
                dateStr: fileDate
            });
        }

        return items;
    }

    function renderNews(items) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('countBadge').textContent = items.length + ' 条';

        const container = document.getElementById('newsContent');
        container.classList.remove('hidden');
        container.innerHTML = '';

        if (items.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无资讯</p></div>';
            return;
        }

        const groups = {};
        items.forEach(item => {
            if (!groups[item.dateStr]) groups[item.dateStr] = [];
            groups[item.dateStr].push(item);
        });

        const sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

        sortedDates.forEach(dateStr => {
            const group = document.createElement('div');
            group.className = 'date-group';

            const header = document.createElement('div');
            header.className = 'date-header';
            header.innerHTML = `📅 ${dateStr} <span class="count">${groups[dateStr].length} 条</span>`;
            group.appendChild(header);

            groups[dateStr].forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';

                const pct = Math.round(item.score / 10 * 100);
                const cardContent = `
                    <div class="score">
                        ⭐ ${item.score.toFixed(1)}
                        <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
                    </div>
                    <h2><a href="${item.link}" target="_blank" rel="noopener">${escHtml(item.title)}</a></h2>
                    <div class="summary">${escHtml(item.summary)}</div>
                    <div class="meta">
                        ${item.source ? `<span class="source">${escHtml(item.source)}</span>` : ''}
                        ${item.tags.slice(0, 4).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
                        ${item.discussUrl ? `<span class="discuss"><a href="${item.discussUrl}" target="_blank" rel="noopener">💬 社区讨论</a></span>` : ''}
                    </div>
                `;
                card.innerHTML = cardContent;
                group.appendChild(card);
            });

            container.appendChild(group);
        });
    }

    function escHtml(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', loadNews);
</script>
</body>
</html>
